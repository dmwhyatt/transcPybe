name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    # Pinned: ubuntu-latest moved to 26.04, where setup-python has no 3.9 build, and 3.9 is the floor
    # pyproject.toml declares. Unpin when the floor moves.
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        # The floor is what the package claims to support, and the ceiling is
        # what people will actually install it under.
        python-version: ["3.9", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: sudo apt-get update && sudo apt-get install -y libsndfile1
      # torch is a dependency (the v2 networks); its CPU build keeps CUDA's
      # libraries out of every run. CREPE is an extra, not installed here: its
      # tests are marked slow and deselected.
      - run: pip install torch --index-url https://download.pytorch.org/whl/cpu
      - run: pip install -e ".[dev]"
      - run: pytest -q -m "not slow"

