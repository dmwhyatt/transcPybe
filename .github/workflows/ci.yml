name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    # Pinned: ubuntu-latest moved to 26.04, where setup-python has no 3.9 build, and 3.9 is the floor
    # pyproject.toml declares. Unpin when the floor moves.
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        # The floor is what the package claims to support, and the ceiling is
        # what people will actually install it under.
        python-version: ["3.9", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: sudo apt-get update && sudo apt-get install -y libsndfile1
      # torch is a dependency (the v2 networks); its CPU build keeps CUDA's
      # libraries out of every run. CREPE is an extra, not installed here: its
      # tests are marked slow and deselected.
      - run: pip install torch --index-url https://download.pytorch.org/whl/cpu
      - run: pip install -e ".[dev]"
      - run: pytest -q -m "not slow"

  tune:
    # Tuning borrows the benchmark package, so a base install skips its tests
    # entirely. Without this job that code is only ever run by hand.
    #
    # The benchmark repository is private, and a workflow's default token
    # reaches only its own repository. Until a token with read access to it is
    # added as BENCHMARK_REPO_TOKEN, this job says what is missing rather than
    # failing the build over a secret nobody has set yet.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check out the benchmark package
        id: benchmark
        continue-on-error: true
        uses: actions/checkout@v4
        with:
          repository: dmwhyatt/transcription-benchmarking
          path: .benchmark
          token: ${{ secrets.BENCHMARK_REPO_TOKEN }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: sudo apt-get update && sudo apt-get install -y libsndfile1
      - name: Say why the tuning tests are not running
        if: steps.benchmark.outcome != 'success'
        run: |
          echo "::warning::Tuning tests skipped: could not check out \
          dmwhyatt/transcription-benchmarking. Add a token with read access to it \
          as the BENCHMARK_REPO_TOKEN secret to run them."
      # Installed from the checkout: the benchmark package is not on PyPI, and
      # cloning its repository by URL would need credentials pip does not have.
      - if: steps.benchmark.outcome == 'success'
        run: |
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install -e .benchmark && pip install -e ".[dev]"
      - if: steps.benchmark.outcome == 'success'
        run: pytest -q -m "not slow" tests/test_tune.py
