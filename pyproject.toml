[build-system]
requires = ["setuptools>=77", "wheel"]   # 77: PEP 639 licence expressions
build-backend = "setuptools.build_meta"

[project]
name = "transcpybe"
dynamic = ["version"]                    # transcpybe.__version__, the one place it is set
description = "Transcribe sung melody to MIDI: onsets and pitches from monophonic vocal audio"
readme = "README.md"
requires-python = ">=3.9"
# Split: the code is MIT; the v2 networks' weights and the voicing maps, in
# src/transcpybe/landmarks/weights/, are CC BY-NC-SA 4.0, because the singing
# they were trained on is (see that folder's README.md).
license = "MIT AND CC-BY-NC-SA-4.0"
license-files = ["LICENSE", "src/transcpybe/landmarks/weights/LICENSE"]
authors = [{ name = "David Whyatt" }]
keywords = ["music information retrieval", "transcription", "midi", "singing",
            "melody", "pitch tracking"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Topic :: Multimedia :: Sound/Audio :: Analysis",
]

# The default is transcPybe v2 with pYIN: the networks need torch, the pitch
# tracker only librosa. CREPE and PESTO are extras.
dependencies = [
    "numpy>=1.24",
    "scipy>=1.10",
    "librosa>=0.10",      # pYIN, SuperFlux onsets, resampling
    "soundfile>=0.12",
    "pretty_midi>=0.2.10",
    "mir_eval>=0.7",      # the synthetic self-test
    "torch>=2.0",         # the v2 networks
]

[project.optional-dependencies]
crepe = ["torchcrepe>=0.0.20"]
# LGPL-3.0, which is why it is an extra and never a dependency.
pesto = ["pesto-pitch>=2.0"]
dev = ["pytest>=7.0", "build>=1.0", "twine>=5.0"]

[project.scripts]
transcpybe = "transcpybe.cli:main"

[project.urls]
Homepage = "https://github.com/dmwhyatt/transcpybe"
Issues = "https://github.com/dmwhyatt/transcpybe/issues"

[tool.setuptools.dynamic]
version = { attr = "transcpybe.__version__" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
# The v2 networks (3 x 3.3 MB) and the voicing maps, with their licence.
"transcpybe.landmarks" = ["weights/*.pt", "weights/*.json", "weights/LICENSE", "weights/README.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["slow: exercises the CREPE backend"]
